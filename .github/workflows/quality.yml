name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and quality dependencies
        run: python -m pip install -e ".[dev,docs,notebooks]"
      - name: Validate canonical catalog
        run: python scripts/validate_catalog.py
      - name: Check generated catalog pages
        run: python scripts/generate_catalog.py --check
      - name: Check generated Notebook pages
        run: python scripts/render_notebooks.py --check
      - name: Lint Python
        run: ruff check src tests scripts
      - name: Run unit and offline Notebook tests
        run: pytest
      - name: Build documentation
        run: mkdocs build --strict
      - name: Audit built site
        run: python scripts/audit_site.py site
