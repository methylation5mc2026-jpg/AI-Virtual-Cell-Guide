name: Deploy documentation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "catalog/**"
      - "scripts/generate_catalog.py"
      - "scripts/validate_catalog.py"
      - "scripts/render_notebooks.py"
      - "scripts/audit_site.py"
      - "notebooks/**"
      - "pyproject.toml"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[docs,dev]"
      - run: python scripts/validate_catalog.py
      - run: python scripts/generate_catalog.py --check
      - run: python scripts/render_notebooks.py --check
      - run: mkdocs build --strict
      - run: python scripts/audit_site.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
