name: Beta 试读与可用性反馈
description: 记录概念断点、运行失败和跨学科读者体验
title: "[Beta feedback] "
labels:
  - beta-feedback
body:
  - type: dropdown
    id: background
    attributes:
      label: 背景
      options:
        - AI / 机器学习
        - 生物信息 / 计算生物学
        - 实验生物学
        - 其他跨学科背景
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: 完成了哪些任务？
      description: 请注明访问页面或 Notebook，以及是否成功完成。
    validations:
      required: true
  - type: textarea
    id: first_blocker
    attributes:
      label: 第一个卡点
      description: 包括难懂术语、断链、环境问题或无法运行的单元。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 环境与证据
      description: 操作系统、Python 版本、CPU/GPU；可附去除敏感信息的日志或截图。
  - type: textarea
    id: suggestion
    attributes:
      label: 最希望改进什么？
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 数据安全
      options:
        - label: 我已确认反馈不含令牌、私有数据或可识别个人的组学/临床信息。
          required: true
