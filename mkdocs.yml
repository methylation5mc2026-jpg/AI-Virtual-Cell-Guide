site_name: AI Virtual Cell Guide
site_description: 人工智能虚拟细胞全景知识地图与可复现学习指南
site_author: AI Virtual Cell Guide Contributors
site_url: https://methylation5mc2026-jpg.github.io/AI-Virtual-Cell-Guide/
repo_url: https://github.com/methylation5mc2026-jpg/AI-Virtual-Cell-Guide
repo_name: methylation5mc2026-jpg/AI-Virtual-Cell-Guide
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  logo: assets/aivc-logo.svg
  favicon: assets/aivc-logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - zh
        - en
  - minify:
      minify_html: true

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/catalog.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/methylation5mc2026-jpg/AI-Virtual-Cell-Guide
      name: GitHub
  generator: false

copyright: 内容 CC BY 4.0 · 代码 Apache-2.0 · 仅供教育与科研

