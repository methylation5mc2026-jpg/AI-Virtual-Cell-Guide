[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aivc-guide"
version = "0.2.0"
description = "Code and validation utilities for the AI Virtual Cell Guide"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "anndata>=0.10,<0.13",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
docs = [
  "mkdocs-material>=9.5,<10",
  "mkdocs-minify-plugin>=0.8,<1",
  "nbformat>=5.10,<6",
]
notebooks = [
  "jupyter>=1.0,<2",
  "matplotlib>=3.8,<4",
  "nbclient>=0.10,<1",
  "scanpy>=1.10,<2",
]
dev = [
  "beautifulsoup4>=4.12,<5",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]
gears = [
  "cell-gears==0.1.2",
]
arc = [
  "cell-eval==0.8.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aivc_guide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
